        // ==================== MEDIAPIPE HAND TRACKING ====================
        function initMediaPipeHands() {
            if (typeof Hands === 'undefined') {
                console.warn('MediaPipe Hands library belum siap, mencoba lagi dalam 500ms...');
                setTimeout(initMediaPipeHands, 500);
                return;
            }

            try {
                STATE.handsDetector = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });

                STATE.handsDetector.setOptions({
                    maxNumHands: 2,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                STATE.handsDetector.onResults(onHandResults);
            } catch (err) {
                console.error('Gagal menginisialisasi MediaPipe Hands:', err);
            }
        }

        function setupCamera() {
            return new Promise((resolve, reject) => {
                if (typeof Camera === 'undefined') {
                    alert('Library kamera (Camera Utils) belum siap. Periksa koneksi internet Anda!');
                    reject(new Error('Camera Utils undefined'));
                    return;
                }

                if (STATE.cameraInstance) {
                    resolve();
                    return;
                }

                STATE.cameraInstance = new Camera(STATE.videoElement, {
                    onFrame: async () => {
                        if (STATE.videoElement && STATE.videoElement.readyState >= 2 && STATE.handsDetector) {
                            const startTime = performance.now();
                            await STATE.handsDetector.send({ image: STATE.videoElement });
                            STATE.processingTime = Math.round(performance.now() - startTime);
                        }
                    },
                    width: 640,
                    height: 480
                });

                STATE.cameraInstance.start()
                    .then(() => {
                        document.getElementById('diagCamStatus').textContent = 'ACTIVE';
                        resolve();
                    })
                    .catch((err) => {
                        document.getElementById('diagCamStatus').textContent = 'ERROR';
                        alert('Gagal mengakses kamera webcam. Izinkan akses kamera pada browser Anda!');
                        reject(err);
                    });
            });
        }
